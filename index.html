<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homenagem Dia das Mães</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        body {
            background-image: url('fudo1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #fff5f8;
        }

        /* --- ESTILO DAS PÉTALAS --- */
        .petala {
            position: fixed;
            top: -10%;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: queda-petala linear forwards;
            font-size: 1.2rem;
        }

        @keyframes queda-petala {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(100px) rotate(720deg); opacity: 0; }
        }

        /* --- LOGO --- */
        .empresa-logo {
            width: 120px;
            height: auto;
            max-height: 90px;
            object-fit: contain;
            margin-bottom: 30px;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        /* --- CONTEÚDO SEM CORPO BRANCO --- */
        .conteudo-homenagem {
            width: 100%;
            max-width: 500px;
            text-align: center;
            z-index: 10;
            animation: fadeIn 1.5s ease-out;
        }

        .titulo-header {
            color: #d81b60;
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .mensagem-container {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            cursor: pointer;
        }

        #mensagem-texto {
            font-size: 1.6rem;
            color: #4a148c;
            font-style: italic;
            line-height: 1.4;
            margin: 0;
            transition: opacity 0.4s ease;
            /* Sombra para garantir leitura sobre a imagem de fundo */
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.9), 1px 1px 2px rgba(255, 255, 255, 1);
        }

        .btn-share {
            background-color: #25D366;
            color: white !important;
            border-radius: 50px;
            padding: 14px 30px;
            font-weight: 600;
            border: none;
            text-decoration: none;
            display: inline-block;
            margin-top: 30px;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.3s;
        }

        .btn-share:hover {
            background-color: #1ebe57;
            transform: translateY(-2px);
        }

        .instrucao {
            font-size: 0.8rem;
            color: #d81b60;
            margin-top: 15px;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(255,255,255,0.8);
        }

        @media (max-width: 480px) {
            #mensagem-texto { font-size: 1.4rem; }
            .empresa-logo { width: 100px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <img src="logo.png" alt="Logo" class="empresa-logo">

    <div class="conteudo-homenagem">
        <div class="titulo-header">
            🌸 Feliz Dia das Mães 🌸
        </div>

        <div class="mensagem-container" onclick="sortearMensagem()">
            <p id="mensagem-texto">Carregando carinho...</p>
        </div>

        <p class="instrucao">Toque na frase para trocar 💕</p>

        <a href="javascript:void(0)" class="btn-share" onclick="compartilharWhatsApp()">
            ENVIAR PELO WHATSAPP
        </a>
    </div>

    <script>
        const mensagens = [
            "Mãe, seu amor é o jardim onde a minha vida floresce. Feliz dia!",
            "Nenhuma língua é capaz de expressar a beleza e a força de uma mãe.",
            "Mãe: o amor mais bonito que existe. Te amo!",
            "Obrigado por ser meu porto seguro. Feliz Dia das Mães!",
            "Você é meu exemplo, minha força e meu amor eterno.",
            "Mãe, você é a prova de que anjos existem na Terra.",
            "Tudo que sou devo ao seu amor incondicional.",
            "Seu amor ilumina até os dias mais nublados.",
            "Você é a flor mais linda da minha vida. Parabéns!",
            "Mamãe, você é o amor que a vida me deu de presente. Te amo!!",
            "Obrigado por cada abraço, cada beijo e cada ensinamento."
        ];

        function sortearMensagem() {
            const el = document.getElementById('mensagem-texto');
            el.style.opacity = 0;
            setTimeout(() => {
                const randomMsg = mensagens[Math.floor(Math.random() * mensagens.length)];
                el.innerText = randomMsg;
                el.style.opacity = 1;
            }, 300);
        }

        function compartilharWhatsApp() {
            const texto = document.getElementById('mensagem-texto').innerText;
            const url = "https://api.whatsapp.com/send?text=" + 
                        encodeURIComponent("🌸 *Feliz Dia das Mães!* 💖\n\n_" + texto + "_");
            window.open(url, '_blank');
        }

        function criarPetala() {
            const petala = document.createElement('div');
            petala.className = 'petala';
            const tipos = ['🍃', '🌸', '🌹', '❤️']; 
            petala.innerText = tipos[Math.floor(Math.random() * tipos.length)];
            const cores = ['#ff4d6d', '#ff758f', '#c9184a', '#ffb3c1', '#ff0000'];
            petala.style.color = cores[Math.floor(Math.random() * cores.length)];
            petala.style.left = Math.random() * 100 + "vw";
            petala.style.animationDuration = (Math.random() * 3 + 4) + "s";
            petala.style.opacity = Math.random() * 0.5 + 0.5;
            document.body.appendChild(petala);
            setTimeout(() => { petala.remove(); }, 7000);
        }

        setInterval(criarPetala, 400);
        window.onload = sortearMensagem;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
