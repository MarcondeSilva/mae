<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homenagem Dia das Mães</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        body {
            background-image: url('fudo1.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #fff5f8;
        }

        .petala {
            position: fixed;
            top: -10%;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: queda-petala linear forwards;
            font-size: 1.2rem;
        }

        @keyframes queda-petala {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(100px) rotate(720deg); opacity: 0; }
        }

        .empresa-logo {
            width: 120px;
            margin-bottom: 20px;
            z-index: 10;
        }

        .conteudo-homenagem {
            width: 100%;
            max-width: 300px; 
            text-align: center;
            z-index: 10;
            animation: fadeIn 1.5s ease-out;
        }

        .titulo-header {
            color: #d81b60;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.9);
        }

        .mensagem-container {
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
            cursor: pointer;
        }

        #mensagem-texto {
            font-size: 1rem;
            color: #4a148c;
            font-style: italic;
            transition: opacity 0.4s ease;
        }

        .btn-share {
            background-color: #0a6f10;
            color: white !important;
            border-radius: 50px;
            padding: 12px 25px;
            margin-top: 15px;
            font-size: 0.8rem;
            text-decoration: none !important;
        }

        .instrucao {
            font-size: 0.75rem;
            color: #d81b60;
            margin-top: 10px;
            background: rgba(255,255,255,0.4);
            padding: 2px 10px;
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<img src="logo.png" class="empresa-logo">

<div class="conteudo-homenagem">
    <div class="titulo-header">
        🌸 Feliz 🌸<br> Dia das Mães 
    </div>

    <div class="mensagem-container" onclick="sortearMensagem()">
        <p id="mensagem-texto">Carregando carinho...</p>
    </div>

    <p class="instrucao">Compartilhe com sua mãezinha! 💕</p>

    <a href="javascript:void(0)" class="btn-share" onclick="compartilharWhatsApp()">
        ENVIAR PELO WHATSAPP
    </a>
</div>

<script>
const mensagens = [
"Mãe, seu amor é o jardim onde a minha vida floresce. Feliz dia!",
"Nenhuma língua é capaz de expressar a beleza e a força de uma mãe.",
"Mãe: o amor mais bonito que existe. Te amo!",
"Obrigado por ser meu porto seguro. Feliz Dia das Mães!",
"Você é meu exemplo, minha força e meu amor eterno.",
"Mãe, você é a prova de que anjos existem na Terra.",
"Tudo que sou devo ao seu amor incondicional.",
"Seu amor ilumina até os dias mais nublados.",
"Você é a flor mais linda da minha vida. Parabéns!",
"Mamãe, você é o amor que a vida me deu de presente. Te amo!!"
];

// 🔊 ATIVA MÚSICA NO PRIMEIRO CLIQUE (SEM QUEBRAR NADA)
function ativarMusica() {
    const audio = document.getElementById('musica');
    if (audio.muted) {
        audio.muted = false;
        audio.play().catch(() => {});
    }
}

function sortearMensagem() {
    ativarMusica();

    const el = document.getElementById('mensagem-texto');
    el.style.opacity = 0;

    setTimeout(() => {
        const randomMsg = mensagens[Math.floor(Math.random() * mensagens.length)];
        el.innerText = randomMsg;
        el.style.opacity = 1;
    }, 300);
}

function compartilharWhatsApp() {
    ativarMusica();

    const texto = document.getElementById('mensagem-texto').innerText;
    const url = "https://api.whatsapp.com/send?text=" + 
        encodeURIComponent("🌸 *Feliz Dia das Mães!* 💖\n\n_" + texto + "_");
    window.open(url, '_blank');
}

function criarPetala() {
    const petala = document.createElement('div');
    petala.className = 'petala';
    const tipos = ['🌸','🌹','❤️'];
    petala.innerText = tipos[Math.floor(Math.random() * tipos.length)];
    petala.style.left = Math.random() * 100 + "vw";
    petala.style.animationDuration = (Math.random() * 3 + 4) + "s";
    petala.style.opacity = Math.random() * 0.5 + 0.5;
    document.body.appendChild(petala);
    setTimeout(() => petala.remove(), 7000);
}

setInterval(criarPetala, 450);
window.onload = sortearMensagem;
</script>

<!-- 🎵 MÚSICA (FORMA CORRETA) -->
<audio id="musica" autoplay loop muted>
    <source src="musicamae.mp3" type="audio/mpeg">
</audio>

</body>
</html>
